name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  admin-panel:
    name: Admin lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint admin panel
        run: npm run lint
      - name: Test admin panel
        run: npm test
      - name: Build admin panel
        run: npm run build
